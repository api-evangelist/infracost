naftiko: 1.0.0-alpha2
info:
  label: Infracost Cloud Pricing API
  description: 'Infracost Cloud Pricing API. 2 operations. Lead operation: Generate Cost Breakdown. Self-contained Naftiko
    capability covering one Infracost business surface.'
  tags:
  - Infracost
  - Infracost Cloud Pricing API
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    INFRACOST_API_KEY: INFRACOST_API_KEY
capability:
  consumes:
  - type: http
    namespace: infracost
    baseUri: https://pricing.api.infracost.io
    description: Infracost Cloud Pricing API business capability. Self-contained, no shared references.
    resources:
    - name: breakdown
      path: /breakdown
      operations:
      - name: generatebreakdown
        method: POST
        description: Generate Cost Breakdown
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: diff
      path: /diff
      operations:
      - name: generatediff
        method: POST
        description: Generate Cost Diff
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: x-api-key
      value: '{{env.INFRACOST_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: infracost-rest
    port: 8080
    description: REST adapter for Infracost Cloud Pricing API. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/breakdown
      name: breakdown
      description: REST surface for breakdown.
      operations:
      - method: POST
        name: generatebreakdown
        description: Generate Cost Breakdown
        call: infracost.generatebreakdown
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/diff
      name: diff
      description: REST surface for diff.
      operations:
      - method: POST
        name: generatediff
        description: Generate Cost Diff
        call: infracost.generatediff
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: infracost-mcp
    port: 9090
    transport: http
    description: MCP adapter for Infracost Cloud Pricing API. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: generate-cost-breakdown
      description: Generate Cost Breakdown
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: infracost.generatebreakdown
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: generate-cost-diff
      description: Generate Cost Diff
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: infracost.generatediff
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
